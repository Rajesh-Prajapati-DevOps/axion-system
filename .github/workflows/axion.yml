
name: Terraform Plan - Azure

on:
  workflow_dispatch:
    inputs:
      run_fmt:
        description: "Terraform Format Check"
        type: boolean
        required: true
        default: false

      run_init:
        description: "Terraform Init"
        type: boolean
        required: true
        default: false

      run_validate:
        description: "Terraform Validate"
        type: boolean
        required: true
        default: false

      run_plan:
        description: "Terraform Plan"
        type: boolean
        required: true
        default: true

      run_infracost:
        description: "Infracost Cost Estimate"
        type: boolean
        required: true
        default: false

      run_all:
        description: "Run All Tasks"
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    name: Terraform and Infracost
    runs-on: self-hosted

    defaults:
      run:
        working-directory: environments/preprod

    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    steps:
      # Step 1: Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Validate task selection
      - name: Validate task selection
        shell: powershell
        env:
          RUN_FMT: ${{ inputs.run_fmt }}
          RUN_INIT: ${{ inputs.run_init }}
          RUN_VALIDATE: ${{ inputs.run_validate }}
          RUN_PLAN: ${{ inputs.run_plan }}
          RUN_INFRACOST: ${{ inputs.run_infracost }}
          RUN_ALL: ${{ inputs.run_all }}
        run: |
          $selected = @(
            $env:RUN_FMT,
            $env:RUN_INIT,
            $env:RUN_VALIDATE,
            $env:RUN_PLAN,
            $env:RUN_INFRACOST,
            $env:RUN_ALL
          ) -contains "true"

          if (-not $selected) {
            throw "Select at least one task."
          }

          if ($env:RUN_ALL -eq "true") {
            Write-Host "All tasks selected."
          } else {
            Write-Host "Task selection validated successfully."
          }

      # Step 3: Terraform version
      - name: Terraform Version
        if: inputs.run_all || inputs.run_init || inputs.run_validate || inputs.run_plan
        run: terraform version

      # Step 4: Terraform format check
      - name: Terraform Format Check
        if: inputs.run_all || inputs.run_fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      # Step 5: Terraform init
      - name: Terraform Init
        if: inputs.run_all || inputs.run_init || inputs.run_validate || inputs.run_plan
        run: terraform init -input=false

      # Step 6: Terraform validate
      - name: Terraform Validate
        if: inputs.run_all || inputs.run_validate || inputs.run_plan
        run: terraform validate

      # Step 7: Terraform plan
      - name: Terraform Plan
        if: inputs.run_all || inputs.run_plan
        run: terraform plan -input=false -no-color

      # Step 8: Infracost
      - name: Infracost Calculate Total
        if: inputs.run_all || inputs.run_infracost
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: infracost breakdown --path .
