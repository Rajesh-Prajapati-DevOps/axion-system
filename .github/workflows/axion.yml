
name: Terraform Plan - Azure

on:
  push:
    branches:
      - main
    paths:
      - 'environments/preprod/**'
      - '.github/workflows/axion.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'environments/preprod/**'
      - '.github/workflows/axion.yml'

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  terraform-plan:
    name: Terraform Init, Validate and Plan
    runs-on: self-hosted

    defaults:
      run:
        working-directory: environments/preprod

    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    steps:
      # Step 1: Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Verify Terraform installation
      - name: Check Terraform version
        run: terraform version

      # Step 3: Terraform formatting check
      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        continue-on-error: true

      # Step 4: Initialize Terraform
      - name: Terraform Init
        run: terraform init -input=false

      # Step 5: Validate Terraform configuration
      - name: Terraform Validate
        run: terraform validate

      # Step 6: Generate Terraform plan
      - name: Terraform Plan
        run: terraform plan -input=false -no-color

      # Step 7: infracost calculate
      - name: Infracost Calculate Total
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: infracost breakdown --path .

