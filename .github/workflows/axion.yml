

name: Terraform Plan - Azure

on:
  workflow_dispatch:
    inputs:
      run_task:
        description: "Select the task to run"
        required: true
        type: choice
        default: plan
        options:
          - fmt
          - init
          - validate
          - plan
          - infracost
          - all

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    name: Terraform and Infracost
    runs-on: self-hosted

    defaults:
      run:
        working-directory: environments/preprod

    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Terraform Version
        if: inputs.run_task == 'all'
        run: terraform version

      - name: Terraform Format Check
        if: inputs.run_task == 'fmt' || inputs.run_task == 'all'
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        if: inputs.run_task == 'init' || inputs.run_task == 'validate' || inputs.run_task == 'plan' || inputs.run_task == 'all'
        run: terraform init -input=false

      - name: Terraform Validate
        if: inputs.run_task == 'validate' || inputs.run_task == 'plan' || inputs.run_task == 'all'
        run: terraform validate

      - name: Terraform Plan
        if: inputs.run_task == 'plan' || inputs.run_task == 'all'
        run: terraform plan -input=false -no-color

      - name: Infracost Calculate Total
        if: inputs.run_task == 'infracost' || inputs.run_task == 'all'
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: infracost breakdown --path .
