
name: Terraform Plan - Azure

on:
  push:
    branches:
      - main
    paths:
      - 'environments/preprod/**'
      - '.github/workflows/axion.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'environments/preprod/**'
      - '.github/workflows/axion.yml'

  workflow_dispatch:
    inputs:
      run_task:
        description: 'Select which task to run'
        required: true
        type: choice
        default: all
        options:
          - all
          - fmt
          - init
          - validate
          - plan
          - infracost

permissions:
  contents: read
  id-token: write

jobs:
  terraform-plan:
    name: Terraform Init, Validate and Plan
    runs-on: self-hosted

    defaults:
      run:
        working-directory: environments/preprod

    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    steps:
      
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Terraform Version
        if: github.event_name != 'workflow_dispatch' || inputs.run_task == 'all'
        run: terraform version

      - name: Terraform Format Check
        if: github.event_name != 'workflow_dispatch' || inputs.run_task == 'all' || inputs.run_task == 'fmt'
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        if: github.event_name != 'workflow_dispatch' || inputs.run_task == 'all' || inputs.run_task == 'init' || inputs.run_task == 'validate' || inputs.run_task == 'plan'
        run: terraform init -input=false

      - name: Terraform Validate
        if: github.event_name != 'workflow_dispatch' || inputs.run_task == 'all' || inputs.run_task == 'validate' || inputs.run_task == 'plan'
        run: terraform validate

      - name: Terraform Plan
        if: github.event_name != 'workflow_dispatch' || inputs.run_task == 'all' || inputs.run_task == 'plan'
        run: terraform plan -input=false -no-color

      - name: Infracost Calculate Total
        if: github.event_name != 'workflow_dispatch' || inputs.run_task == 'all' || inputs.run_task == 'infracost'
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: infracost breakdown --path .


